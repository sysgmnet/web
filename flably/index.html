<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flably</title>
<link rel="icon" type="image/png" href="flably-icon.png">
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background-color: #0d1117;
    color: #c9d1d9;
    line-height: 1.5;
  }

  a {
    color: #58a6ff;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  .header {
    background-color: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
  }

  .header-title {
    font-size: 20px;
    font-weight: 600;
    color: #f0f6fc;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 16px;
  }

  .page-title {
    font-size: 24px;
    font-weight: 600;
    color: #f0f6fc;
    margin: 0 0 24px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid #30363d;
  }

  .section {
    background-color: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    margin-bottom: 24px;
    overflow: hidden;
  }

  .section-header {
    padding: 12px 16px;
    background-color: #1c2128;
    border-bottom: 1px solid #30363d;
    font-weight: 600;
    font-size: 16px;
    color: #f0f6fc;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-header .badge {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 500;
  }

  .badge-release { background-color: #238636; color: #fff; }
  .badge-beta { background-color: #9e6a03; color: #fff; }
  .badge-alpha { background-color: #8957e5; color: #fff; }

  .section-body { padding: 0; }

  .release-item {
    padding: 12px 16px;
    border-bottom: 1px solid #21262d;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .release-item:last-child { border-bottom: none; }

  .release-item a {
    font-size: 16px;
    font-weight: 500;
  }

  .release-item a::before {
    content: "⬇ ";
    color: #8b949e;
    font-size: 14px;
  }

  .help-btn {
    background: none;
    border: 1px solid #30363d;
    color: #8b949e;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .help-btn:hover {
    background-color: #30363d;
    color: #f0f6fc;
  }

  .help-btn.active {
    background-color: #58a6ff;
    border-color: #58a6ff;
    color: #fff;
  }

  .empty {
    padding: 16px;
    color: #8b949e;
    font-style: italic;
    font-size: 14px;
  }

  .sidebar {
    position: fixed;
    top: 90px;
    right: 40px;
    width: 30%;
    max-width: 500px;
    color: #c9d1d9;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    display: none;
  }

    .release-date {
    color: #8b949e;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="header">
  <img src="flably-icon.png" alt="Flably" class="header-icon">
  <span class="header-title">Flably</span>
</div>

<div class="container">
  <h1 class="page-title">Releases</h1>

  <div class="section" id="section-release">
    <div class="section-header">
      <span class="badge badge-release">Release</span>
    </div>
    <div class="section-body" id="body-release"></div>
  </div>

  <div class="section" id="section-beta">
    <div class="section-header">
      <span class="badge badge-beta">Beta</span>
    </div>
    <div class="section-body" id="body-beta"></div>
  </div>

  <div class="section" id="section-alpha">
    <div class="section-header">
      <span class="badge badge-alpha">Alpha</span>
    </div>
    <div class="section-body" id="body-alpha"></div>
  </div>
</div>

<div class="sidebar" id="sidebar-content"></div>

<script>
  const releases = {
    release: [

    ],
    beta: [

    ],
    alpha: [
      {
        title: "Flably Alpha v0.2.1",
        link: "https://github.com/sysgmnet/Flably-alpha/releases/download/Flably_Alpha_v0.2.1/Flably_alpha_v0.2.1.zip",
        date: "Oct 21, 2026",
        notes: "Updates:\n\n- Menu music volume fixed\n- Editor grid added\n- Expanded game board\n- Camera follows player\n- Editor scale added"
      },
      {
        title: "Flably Alpha v0.2.0",
        link: "https://github.com/sysgmnet/Flably-alpha/releases/download/Flably_Alpha_v0.2.0/Flably_alpha_v0.2.zip",
        date: "Oct 16, 2026",
        notes: "New Features:\n- Textures\n- Menu music\n- Virtual Resolution\n- Custom level creation \n- Editor and game are ready"
      },
      {
        title: "Flably Alpha v0.1.0",
        link: "https://github.com/sysgmnet/Flably-alpha/releases/download/Flably_Alpha_v0.1.0/Flably_alpha_v0.1.zip",
        date: "Sep 17, 2026",
        notes: "Initial release.\nPlayer - a square that moves around the screen\nEnvironment - basic obstacles"
      },
    ],
  };

  function renderSection(type) {
    const body = document.getElementById("body-" + type);
    const items = releases[type];

    if (!items || items.length === 0) {
      body.innerHTML = '<div class="empty">There\'s nothing here now</div>';
      return;
    }

    body.innerHTML = items
      .map((item) => {
        const safeNotes = (item.notes || "").replace(/"/g, '&quot;');
        const safeDate = item.date || "";

        return `
          <div class="release-item">
            <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
            <div style="display: flex; align-items: center; gap: 16px;">
              <span class="release-date">${safeDate}</span>
              <button class="help-btn" data-notes="${safeNotes}" onclick="showNotes(this)">?</button>
            </div>
          </div>
        `;
      })
      .join("");
  }

  function showNotes(btn) {
    document.querySelectorAll('.help-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const notes = btn.getAttribute('data-notes');
    const contentEl = document.getElementById('sidebar-content');

    if (notes && notes.trim() !== "") {
      contentEl.innerText = notes;
      contentEl.style.display = "block";
    } else {
      contentEl.innerText = "";
      contentEl.style.display = "none";
    }
  }

  renderSection("release");
  renderSection("beta");
  renderSection("alpha");

  window.addEventListener('DOMContentLoaded', () => {
    const firstBtn = document.querySelector('.help-btn');
    if (firstBtn) {
      firstBtn.click();
    }
  });
</script>

</body>
</html>
